services:
  postgres:
    image: postgres:16-alpine
    container_name: taskmanager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Bound to loopback: the database is never exposed on the host network.
      # For remote access use an SSH tunnel or a managed database.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          cpus: "0.5"
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: taskmanager-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      # Loopback only — the cache is an internal service, not a public one.
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
        reservations:
          cpus: "0.1"
          memory: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: ./backend
    image: taskmanager-backend
    container_name: taskmanager-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_SSLMODE: disable
      SERVER_PORT: "8080"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      SMS_KEY: ${SMS_KEY}
      SMS_API_KEY: ${SMS_API_KEY}
      SENDER_ID: ${SENDER_ID}
      DEFAULT_SMS_SENDER_ID: ${DEFAULT_SMS_SENDER_ID}
      SMS_BASE_URL: ${SMS_BASE_URL}
      # Public URL used in SMS links (invites, resets).
      APP_URL: ${APP_URL:-}
      # Comma-separated browser origins allowed to call the API. Required in
      # production (e.g. https://app.example.com); when unset only loopback
      # origins are accepted, which keeps local development working.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DUE_REMINDER_WINDOW_HOURS: ${DUE_REMINDER_WINDOW_HOURS:-24}
      DUE_REMINDER_INTERVAL: ${DUE_REMINDER_INTERVAL:-60}
    ports:
      # The API is reached through the reverse proxy on the internal network;
      # publishing it on loopback only keeps the playground reachable locally
      # without exposing it to the host network.
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
        reservations:
          cpus: "0.25"
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_API_VERSION: ${VITE_API_VERSION:-v1}
        VITE_ENCRYPTED_MARKER: ${VITE_ENCRYPTED_MARKER:-1}
    image: taskmanager-frontend
    container_name: taskmanager-frontend
    restart: unless-stopped
    volumes: []
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
        reservations:
          cpus: "0.1"
          memory: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  redisdata:

networks:
  default:
    name: taskmanager-net